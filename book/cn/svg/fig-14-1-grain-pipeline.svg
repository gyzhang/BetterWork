<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- 图 14-1 从工作簿到可复核结论的五道关（《智能体工程》第 14 章配图） -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="fig-header" data-pptx-bounds="70 126 1140 70">
    <text x="70" y="160" font-size="32" font-weight="bold" fill="#0C2864">从工作簿到可复核结论，中间隔五道关</text>
    <text x="70" y="192" font-size="20" fill="#64748B">读到了只是第一步。后面四步决定这个数能不能被别人复核。</text>
  </g>

  <g id="fig-pipeline" data-pptx-bounds="70 244 1140 150">
    <g id="step-1" data-pptx-bounds="70 260 200 110">
      <rect x="70" y="260" width="200" height="110" rx="10" fill="#1B4593"/>
      <text x="90" y="294" font-size="22" font-weight="bold" fill="#FFFFFF">① 检视</text>
      <text x="90" y="326" font-size="18" fill="#D8E4F0">结构与类型</text>
      <text x="90" y="352" font-size="18" fill="#D8E4F0">公式与缓存</text>
    </g>
    <g id="step-2" data-pptx-bounds="305 260 200 110">
      <rect x="305" y="260" width="200" height="110" rx="10" fill="#2064AE"/>
      <text x="325" y="294" font-size="22" font-weight="bold" fill="#FFFFFF">② 归一化</text>
      <text x="325" y="326" font-size="18" fill="#D8E4F0">显式映射</text>
      <text x="325" y="352" font-size="18" fill="#D8E4F0">符号与单位</text>
    </g>
    <g id="step-3" data-pptx-bounds="540 260 200 110">
      <rect x="540" y="260" width="200" height="110" rx="10" fill="#3D86D4"/>
      <text x="560" y="294" font-size="22" font-weight="bold" fill="#FFFFFF">③ 校验</text>
      <text x="560" y="326" font-size="18" fill="#FFFFFF">键唯一性</text>
      <text x="560" y="352" font-size="18" fill="#FFFFFF">币种与量纲</text>
    </g>
    <g id="step-4" data-pptx-bounds="775 260 200 110">
      <rect x="775" y="260" width="200" height="110" rx="10" fill="#7FA8D9"/>
      <text x="795" y="294" font-size="22" font-weight="bold" fill="#0C2864">④ 聚合连接</text>
      <text x="795" y="326" font-size="18" fill="#0C2864">先聚合</text>
      <text x="795" y="352" font-size="18" fill="#0C2864">再连接</text>
    </g>
    <g id="step-5" data-pptx-bounds="1010 260 200 110">
      <rect x="1010" y="260" width="200" height="110" rx="10" fill="#B9CCE4"/>
      <text x="1030" y="294" font-size="22" font-weight="bold" fill="#0C2864">⑤ 对账</text>
      <text x="1030" y="326" font-size="18" fill="#0C2864">独立算术</text>
      <text x="1030" y="352" font-size="18" fill="#0C2864">行数与合计</text>
    </g>
  </g>

  <g id="fig-notes" data-pptx-bounds="70 412 1140 158">
    <rect x="70" y="412" width="1140" height="158" rx="8" fill="#F5F8FC"/>
    <text x="98" y="450" font-size="24" font-weight="bold" fill="#0C2864">① ② ③ 检查结构与类型，④ 检查关系，只有 ⑤ 检查语义</text>
    <text x="98" y="486" font-size="20" fill="#0C2864">前四道关都能在语法完全正确的前提下通过：查询执行成功、类型匹配、没有报错。</text>
    <text x="98" y="516" font-size="20" fill="#2064AE">④ 的唯一判据是：这个连接会不会把一行放大成多行。会放大，就先聚合。</text>
    <text x="98" y="546" font-size="18" fill="#DF203C">⑤ 用的是独立的算术（行数、合计）。它是唯一的语义正确性检查。</text>
  </g>

  <g id="fig-conclusion" data-pptx-bounds="70 592 1140 96">
    <rect x="70" y="592" width="1140" height="96" rx="8" fill="#EEF4FB"/>
    <path d="M78 592 a8 8 0 0 0 -8 8 v80 a8 8 0 0 0 8 8 z" fill="#1B4593"/>
    <text x="98" y="628" font-size="24" font-weight="bold" fill="#0C2864">跳过任何一道关，你得到的都不是差一点的结果</text>
    <text x="98" y="658" font-size="20" fill="#0C2864">是一个看起来正常的错误结果——而且它会有干净的格式和通顺的说明。</text>
  </g>
</svg>
