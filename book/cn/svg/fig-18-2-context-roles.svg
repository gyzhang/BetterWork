<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- 图 18-2 上下文角色：历史上下文与当前事实的分界（《智能体工程》第 18 章配图） -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="fig-header" data-pptx-bounds="70 126 1140 70">
    <text x="70" y="160" font-size="32" font-weight="bold" fill="#0C2864">上下文里的每一段材料都要有角色</text>
    <text x="70" y="192" font-size="20" fill="#64748B">上一期的报告"看起来有数字"——没有角色标注，程序分不出它和本期输入。</text>
  </g>

  <g id="fig-context" data-pptx-bounds="70 240 1140 344">
    <text x="94" y="268" font-size="18" fill="#64748B">上下文里的东西</text>
    <text x="494" y="268" font-size="18" fill="#64748B">角色</text>
    <text x="860" y="268" font-size="18" fill="#64748B">能不能当当前事实</text>
    <line x1="70" y1="280" x2="1210" y2="280" stroke="#D8E4F0" stroke-width="1.5"/>

    <g id="ctx-1" data-pptx-bounds="70 288 1140 50">
      <rect x="70" y="288" width="1140" height="50" rx="6" fill="#F5F8FC"/>
      <text x="94" y="320" font-size="20" fill="#0C2864">本期选定的总账</text>
      <text x="494" y="320" font-size="20" font-weight="bold" fill="#1B4593">当前输入</text>
      <text x="860" y="320" font-size="20" fill="#2064AE">能</text>
    </g>
    <g id="ctx-2" data-pptx-bounds="70 338 1140 50">
      <text x="94" y="370" font-size="20" fill="#0C2864">本期选定的预算</text>
      <text x="494" y="370" font-size="20" font-weight="bold" fill="#1B4593">当前输入</text>
      <text x="860" y="370" font-size="20" fill="#2064AE">能</text>
    </g>
    <g id="ctx-3" data-pptx-bounds="70 388 1140 50">
      <rect x="70" y="388" width="1140" height="50" rx="6" fill="#FDF3E3"/>
      <text x="94" y="420" font-size="20" fill="#0C2864">上一期的完整报告</text>
      <text x="494" y="420" font-size="20" font-weight="bold" fill="#B9770E">历史上下文</text>
      <text x="860" y="420" font-size="20" font-weight="bold" fill="#DF203C">绝对不能</text>
    </g>
    <g id="ctx-4" data-pptx-bounds="70 438 1140 50">
      <rect x="70" y="438" width="1140" height="50" rx="6" fill="#FDF3E3"/>
      <text x="94" y="470" font-size="20" fill="#0C2864">上一期的幻灯片结构</text>
      <text x="494" y="470" font-size="20" font-weight="bold" fill="#B9770E">呈现结构</text>
      <text x="860" y="470" font-size="20" fill="#DF203C">不能（它只是版式）</text>
    </g>
    <g id="ctx-5" data-pptx-bounds="70 488 1140 50">
      <rect x="70" y="488" width="1140" height="50" rx="6" fill="#F5F8FC"/>
      <text x="94" y="520" font-size="20" fill="#0C2864">已批准的口径定义</text>
      <text x="494" y="520" font-size="20" font-weight="bold" fill="#1B4593">方法</text>
      <text x="860" y="520" font-size="20" fill="#2064AE">能，且必须用</text>
    </g>
    <g id="ctx-6" data-pptx-bounds="70 538 1140 50">
      <text x="94" y="570" font-size="20" fill="#0C2864">复核者的偏好记录</text>
      <text x="494" y="570" font-size="20" font-weight="bold" fill="#1B4593">偏好</text>
      <text x="860" y="570" font-size="20" fill="#2064AE">能，但只用于"怎么做"</text>
    </g>
  </g>

  <g id="fig-conclusion" data-pptx-bounds="70 604 1140 84">
    <rect x="70" y="604" width="1140" height="84" rx="8" fill="#EEF4FB"/>
    <path d="M78 604 a8 8 0 0 0 -8 8 v68 a8 8 0 0 0 8 8 z" fill="#1B4593"/>
    <text x="98" y="636" font-size="22" font-weight="bold" fill="#0C2864">当你写下"注意不要使用上一期的数字"时，就该想到：这句话应该变成一条测试</text>
    <text x="98" y="666" font-size="18" fill="#2064AE">契约写在文档里是约定，写进测试里才是边界。</text>
  </g>
</svg>
