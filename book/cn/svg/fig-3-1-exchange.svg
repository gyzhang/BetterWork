<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- 图 3-1 一次工具交换的五个环节（《智能体工程》第 3 章配图）
       逐元素手写。字号：标题 32 / 环节名 22 / 正文 20 / 注 18。内容区 y126 起。 -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="fig-header" data-pptx-bounds="70 126 1140 70">
    <text x="70" y="160" font-size="32" font-weight="bold" fill="#0C2864">一次工具交换：五个环节，只有一个属于模型</text>
    <text x="70" y="192" font-size="20" fill="#64748B">模型只产出「意图」。能否执行、执行什么、怎么回填，全在你自己的代码里。</text>
  </g>

  <g id="fig-steps" data-pptx-bounds="70 300 1140 232">
    <g id="step1" data-pptx-bounds="70 336 204 188">
      <rect x="70" y="336" width="204" height="188" rx="10" fill="#F5F8FC"/>
      <text x="90" y="384" font-size="22" font-weight="bold" fill="#1B4593">① 发起请求</text>
      <text x="90" y="428" font-size="18" fill="#0C2864">消息、工具定义</text>
      <text x="90" y="454" font-size="18" fill="#0C2864">与中止信号</text>
      <text x="90" y="496" font-size="18" fill="#64748B">你的代码</text>
    </g>
    <g id="step2" data-pptx-bounds="304 336 204 188">
      <rect x="304" y="336" width="204" height="188" rx="10" fill="#0C2864"/>
      <text x="324" y="384" font-size="22" font-weight="bold" fill="#FFFFFF">② 产出意图</text>
      <text x="324" y="428" font-size="18" fill="#FFFFFF">文本与工具调用</text>
      <text x="324" y="454" font-size="18" fill="#FFFFFF">它不做任何动作</text>
      <text x="324" y="496" font-size="18" fill="#FFFFFF">模型服务</text>
    </g>
    <g id="step3" data-pptx-bounds="538 336 204 188">
      <rect x="538" y="336" width="204" height="188" rx="10" fill="#F5F8FC"/>
      <text x="558" y="384" font-size="22" font-weight="bold" fill="#1B4593">③ 校验执行</text>
      <text x="558" y="428" font-size="18" fill="#0C2864">解析、校验</text>
      <text x="558" y="454" font-size="18" fill="#0C2864">唯一的副作用入口</text>
      <text x="558" y="496" font-size="18" fill="#64748B">你的代码</text>
    </g>
    <g id="step4" data-pptx-bounds="772 336 204 188">
      <rect x="772" y="336" width="204" height="188" rx="10" fill="#F5F8FC"/>
      <text x="792" y="384" font-size="22" font-weight="bold" fill="#1B4593">④ 回填观测</text>
      <text x="792" y="428" font-size="18" fill="#0C2864">回填成一条消息</text>
      <text x="792" y="454" font-size="18" fill="#0C2864">下轮模型能读到</text>
      <text x="792" y="496" font-size="18" fill="#64748B">你的代码</text>
    </g>
    <g id="step5" data-pptx-bounds="1006 336 204 188">
      <rect x="1006" y="336" width="204" height="188" rx="10" fill="#F5F8FC"/>
      <text x="1026" y="384" font-size="22" font-weight="bold" fill="#1B4593">⑤ 下一轮</text>
      <text x="1026" y="428" font-size="18" fill="#0C2864">带着观测</text>
      <text x="1026" y="454" font-size="18" fill="#0C2864">再问一次</text>
      <text x="1026" y="496" font-size="18" fill="#64748B">你的代码</text>
    </g>
    <g id="arrow1" data-pptx-bounds="276 420 26 32"><path d="M300 436 l-22 -8 v16 z" fill="#1B4593"/></g>
    <g id="arrow2" data-pptx-bounds="510 420 26 32"><path d="M534 436 l-22 -8 v16 z" fill="#1B4593"/></g>
    <g id="arrow3" data-pptx-bounds="744 420 26 32"><path d="M768 436 l-22 -8 v16 z" fill="#1B4593"/></g>
    <g id="arrow4" data-pptx-bounds="978 420 26 32"><path d="M1002 436 l-22 -8 v16 z" fill="#1B4593"/></g>
  </g>

  <g id="fig-conclusion" data-pptx-bounds="70 564 1140 124">
    <rect x="70" y="564" width="1140" height="124" rx="8" fill="#EEF4FB"/>
    <path d="M78 564 a8 8 0 0 0 -8 8 v108 a8 8 0 0 0 8 8 z" fill="#1B4593"/>
    <text x="98" y="596" font-size="24" font-weight="bold" fill="#0C2864">第 ③ 步是全书最重要的位置</text>
    <text x="98" y="626" font-size="20" fill="#0C2864">它是唯一能产生副作用的地方，也是唯一能做校验、唯一能拒绝的地方。</text>
    <text x="98" y="652" font-size="20" fill="#2064AE">参数是分片传的，所以执行必须等流结束；调用身份必须逐条对齐。</text>
    <text x="98" y="676" font-size="18" fill="#64748B">评估一个工具时，先列出它的禁止集，再看它的功能集。</text>
  </g>
</svg>
