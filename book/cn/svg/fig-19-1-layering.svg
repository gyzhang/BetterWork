<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- 图 19-1 交付分层：界面、宿主与核心各自拥有什么（《智能体工程》第 19 章配图） -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="fig-header" data-pptx-bounds="70 126 1140 70">
    <text x="70" y="160" font-size="32" font-weight="bold" fill="#0C2864">界面可以换，宿主的职责不能分两份</text>
    <text x="70" y="192" font-size="20" fill="#64748B">CLI 和 API 调用同一组应用操作。各自实现权限，就会变成两套权限。</text>
  </g>

  <g id="fig-layers" data-pptx-bounds="70 244 1140 300">
    <g id="layer-ui" data-pptx-bounds="70 260 720 76">
      <rect x="70" y="260" width="720" height="76" rx="10" fill="#EEF4FB" stroke="#D8E4F0" stroke-width="1.5"/>
      <text x="92" y="294" font-size="22" font-weight="bold" fill="#1B4593">CLI / 提供的薄 UI</text>
      <text x="92" y="322" font-size="18" fill="#0C2864">只做请求构造与呈现，不做判定</text>
    </g>
    <g id="layer-host" data-pptx-bounds="70 352 720 100">
      <rect x="70" y="352" width="720" height="100" rx="10" fill="#1B4593"/>
      <text x="92" y="386" font-size="22" font-weight="bold" fill="#FFFFFF">宿主</text>
      <text x="92" y="416" font-size="18" fill="#D8E4F0">身份 · 范围 · 配置 · 生命周期 · 持久化</text>
      <text x="92" y="434" font-size="18" fill="#D8E4F0">权限检查与指标计算只在这里发生</text>
    </g>
    <g id="layer-core" data-pptx-bounds="70 464 720 76">
      <rect x="70" y="464" width="720" height="76" rx="10" fill="#3D86D4"/>
      <text x="92" y="498" font-size="22" font-weight="bold" fill="#FFFFFF">核心循环 · 提供方 · 有界工具</text>
      <text x="92" y="526" font-size="18" fill="#FFFFFF">只回答"这一步做什么"，不回答"允不允许"</text>
    </g>
    <g id="host-only" data-pptx-bounds="820 260 390 280">
      <rect x="820" y="260" width="390" height="280" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5"/>
      <path d="M828 260 a8 8 0 0 0 -8 8 v264 a8 8 0 0 0 8 8 z" fill="#2064AE"/>
      <text x="848" y="296" font-size="22" font-weight="bold" fill="#2064AE">宿主独占拥有</text>
      <text x="848" y="332" font-size="20" fill="#0C2864">身份与作用域</text>
      <text x="848" y="362" font-size="20" fill="#0C2864">配置与凭据</text>
      <text x="848" y="392" font-size="20" fill="#0C2864">生命周期与终态</text>
      <text x="848" y="422" font-size="20" fill="#0C2864">持久化与检查点</text>
      <text x="848" y="452" font-size="20" fill="#0C2864">权限判定与拒绝</text>
      <text x="848" y="482" font-size="20" fill="#0C2864">指标的确定性计算</text>
      <text x="848" y="516" font-size="18" fill="#DF203C">这些在界面层重复一次，就是两个版本</text>
    </g>
  </g>

  <g id="fig-conclusion" data-pptx-bounds="70 564 1140 124">
    <rect x="70" y="564" width="1140" height="124" rx="8" fill="#EEF4FB"/>
    <path d="M78 564 a8 8 0 0 0 -8 8 v108 a8 8 0 0 0 8 8 z" fill="#1B4593"/>
    <text x="98" y="600" font-size="24" font-weight="bold" fill="#0C2864">交付的意思是六个动词，不是一个</text>
    <text x="98" y="632" font-size="20" fill="#0C2864">安装 · 配置 · 运行 · 停止 · 检查 · 修订。少了后面三个，你交出去的只是一个演示。</text>
    <text x="98" y="662" font-size="18" fill="#2064AE">一次本地演练不构成对生产安全、监管合规或运行适宜性的认证。</text>
  </g>
</svg>
