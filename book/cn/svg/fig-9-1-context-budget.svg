<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- 图 9-1 上下文预算的七个槽位（《智能体工程》第 9 章配图） -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="fig-header" data-pptx-bounds="70 126 1140 70">
    <text x="70" y="160" font-size="32" font-weight="bold" fill="#0C2864">七样东西在抢同一块空间</text>
    <text x="70" y="192" font-size="20" fill="#64748B">上下文是一张有额度的预算表，不是仓库。每一项都要为它的位置负责。</text>
  </g>

  <g id="fig-table" data-pptx-bounds="70 248 1140 356">
    <text x="94" y="272" font-size="18" fill="#64748B">槽位</text>
    <text x="260" y="272" font-size="18" fill="#64748B">内容</text>
    <text x="690" y="272" font-size="18" fill="#64748B">谁写的</text>
    <text x="940" y="272" font-size="18" fill="#64748B">变化频率</text>
    <line x1="70" y1="286" x2="1210" y2="286" stroke="#D8E4F0" stroke-width="1.5"/>

    <g id="slot-1" data-pptx-bounds="70 292 1140 44">
      <rect x="70" y="292" width="1140" height="44" rx="8" fill="#F5F8FC"/>
      <text x="94" y="320" font-size="20" font-weight="bold" fill="#1B4593">1 运行环境</text>
      <text x="260" y="320" font-size="18" fill="#0C2864">当前日期、时区、平台事实</text>
      <text x="690" y="320" font-size="18" fill="#0C2864">系统</text>
      <text x="940" y="320" font-size="18" fill="#2064AE">几乎不变</text>
    </g>
    <g id="slot-2" data-pptx-bounds="70 336 1140 44">
      <text x="94" y="364" font-size="20" font-weight="bold" fill="#1B4593">2 角色与方法</text>
      <text x="260" y="364" font-size="18" fill="#0C2864">专家配置、Skill 说明</text>
      <text x="690" y="364" font-size="18" fill="#0C2864">用户配置</text>
      <text x="940" y="364" font-size="18" fill="#2064AE">偶尔变</text>
    </g>
    <g id="slot-3" data-pptx-bounds="70 380 1140 44">
      <rect x="70" y="380" width="1140" height="44" rx="8" fill="#F5F8FC"/>
      <text x="94" y="408" font-size="20" font-weight="bold" fill="#1B4593">3 本次任务</text>
      <text x="260" y="408" font-size="18" fill="#0C2864">用户这一次的诉求</text>
      <text x="690" y="408" font-size="18" fill="#0C2864">用户</text>
      <text x="940" y="408" font-size="18" fill="#DF203C">每次都变</text>
    </g>
    <g id="slot-4" data-pptx-bounds="70 424 1140 44">
      <text x="94" y="452" font-size="20" font-weight="bold" fill="#1B4593">4 对话历史</text>
      <text x="260" y="452" font-size="18" fill="#0C2864">本轮会话之前的相关轮次</text>
      <text x="690" y="452" font-size="18" fill="#0C2864">历史</text>
      <text x="940" y="452" font-size="18" fill="#2064AE">逐轮增长</text>
    </g>
    <g id="slot-5" data-pptx-bounds="70 468 1140 44">
      <rect x="70" y="468" width="1140" height="44" rx="8" fill="#FDF3E3"/>
      <text x="94" y="496" font-size="20" font-weight="bold" fill="#1B4593">5 工具定义</text>
      <text x="260" y="496" font-size="18" fill="#0C2864">名称、描述、参数 schema</text>
      <text x="690" y="496" font-size="18" fill="#0C2864">系统</text>
      <text x="940" y="496" font-size="18" fill="#B9770E">按阶段变，很占额度</text>
    </g>
    <g id="slot-6" data-pptx-bounds="70 512 1140 44">
      <text x="94" y="540" font-size="20" font-weight="bold" fill="#1B4593">6 外部材料</text>
      <text x="260" y="540" font-size="18" fill="#0C2864">检索结果、选定文件、上传表格</text>
      <text x="690" y="540" font-size="18" fill="#0C2864">检索与用户</text>
      <text x="940" y="540" font-size="18" fill="#DF203C">每次都变</text>
    </g>
    <g id="slot-7" data-pptx-bounds="70 556 1140 44">
      <rect x="70" y="556" width="1140" height="44" rx="8" fill="#F5F8FC"/>
      <text x="94" y="584" font-size="20" font-weight="bold" fill="#1B4593">7 记忆</text>
      <text x="260" y="584" font-size="18" fill="#0C2864">被确认、作用域匹配的长期事实</text>
      <text x="690" y="584" font-size="18" fill="#0C2864">记忆库</text>
      <text x="940" y="584" font-size="18" fill="#2064AE">按需变</text>
    </g>
  </g>

  <g id="fig-conclusion" data-pptx-bounds="70 620 1140 68">
    <rect x="70" y="620" width="1140" height="68" rx="8" fill="#EEF4FB"/>
    <path d="M78 620 a8 8 0 0 0 -8 8 v52 a8 8 0 0 0 8 8 z" fill="#1B4593"/>
    <text x="98" y="652" font-size="24" font-weight="bold" fill="#0C2864">稳定的放上面，会变的放下面</text>
    <text x="98" y="678" font-size="18" fill="#2064AE">这既是注意力分布的要求，也是前缀缓存命中率的要求。</text>
  </g>
</svg>
