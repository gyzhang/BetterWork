    <g id="sta-2" data-pptx-bounds="690 354 520 62">
      <text x="714" y="392" font-size="20" font-weight="bold" fill="#1B4593">授权发生在宿主</text>
    </g>
    <g id="sta-3" data-pptx-bounds="690 416 520 62">
      <rect x="690" y="416" width="520" height="62" rx="8" fill="#EEF4FB"/>
      <text x="714" y="454" font-size="20" font-weight="bold" fill="#1B4593">工具输出默认不可信</text>
