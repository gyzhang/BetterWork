    <g id="vol-1" data-pptx-bounds="70 292 590 62">
      <rect x="70" y="292" width="590" height="62" rx="8" fill="#F5F8FC"/>
      <text x="94" y="330" font-size="20" fill="#0C2864">传输与会话模型</text>
    </g>
    <g id="vol-2" data-pptx-bounds="70 354 590 62">
      <text x="94" y="392" font-size="20" fill="#0C2864">扩展机制：界面与长任务</text>
    </g>
    <g id="vol-3" data-pptx-bounds="70 416 590 62">
      <rect x="70" y="416" width="590" height="62" rx="8" fill="#F5F8FC"/>
      <text x="94" y="454" font-size="20" fill="#0C2864">版本号与生命周期方法</text>
    </g>
    <g id="vol-4" data-pptx-bounds="70 478 590 62">
      <text x="94" y="516" font-size="20" fill="#0C2864">工具 Schema 的表达能力</text>
    </g>
    <g id="vol-5" data-pptx-bounds="70 540 590 62">
      <rect x="70" y="540" width="590" height="62" rx="8" fill="#F5F8FC"/>
      <text x="94" y="578" font-size="20" fill="#0C2864">缓存与发现的方式</text>
    </g>
  </g>

  <g id="fig-stable" data-pptx-bounds="690 248 520 356">
    <text x="714" y="272" font-size="18" fill="#64748B">不变的（你的架构依据）</text>
    <line x1="690" y1="286" x2="1210" y2="286" stroke="#D8E4F0" stroke-width="1.5"/>
    <g id="sta-1" data-pptx-bounds="690 292 520 62">
      <rect x="690" y="292" width="520" height="62" rx="8" fill="#EEF4FB"/>
      <text x="714" y="330" font-size="20" font-weight="bold" fill="#1B4593">三层角色的划分</text>
