  <g id="fig-conclusion" data-pptx-bounds="70 616 1140 72">
    <rect x="70" y="616" width="1140" height="72" rx="8" fill="#EEF4FB"/>
    <path d="M78 616 a8 8 0 0 0 -8 8 v56 a8 8 0 0 0 8 8 z" fill="#1B4593"/>
    <text x="98" y="650" font-size="24" font-weight="bold" fill="#0C2864">2026-07-28 是一次含破坏性变更的修订，而右边一列一个字没变</text>
    <text x="98" y="678" font-size="18" fill="#2064AE">所以本书教的是职责分工，不是 API 细节——半年后细节会变，分工不会。</text>
