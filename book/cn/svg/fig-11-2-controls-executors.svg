<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- 图 11-2 五类控制与它们的执行者（《智能体工程》第 11 章配图） -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="fig-header" data-pptx-bounds="70 126 1140 70">
    <text x="70" y="160" font-size="32" font-weight="bold" fill="#0C2864">软控制提高成功率，硬控制构成保证</text>
    <text x="70" y="192" font-size="20" fill="#64748B">一份把两者混在一起的清单，会让人误以为「写了规则就等于有了边界」。</text>
  </g>

  <g id="fig-table" data-pptx-bounds="70 248 1140 356">
    <text x="94" y="272" font-size="18" fill="#64748B">控制</text>
    <text x="560" y="272" font-size="18" fill="#64748B">类型</text>
    <text x="750" y="272" font-size="18" fill="#64748B">执行者</text>
    <line x1="70" y1="286" x2="1210" y2="286" stroke="#D8E4F0" stroke-width="1.5"/>

    <g id="ctl-prompt" data-pptx-bounds="70 292 1140 52">
      <rect x="70" y="292" width="1140" height="52" rx="8" fill="#F5F8FC"/>
      <text x="94" y="324" font-size="20" fill="#0C2864">系统提示里的行为约束</text>
      <text x="560" y="324" font-size="20" font-weight="bold" fill="#64748B">软</text>
      <text x="750" y="324" font-size="20" fill="#64748B">模型，不构成保证</text>
    </g>
    <g id="ctl-desc" data-pptx-bounds="70 344 1140 52">
      <text x="94" y="376" font-size="20" fill="#0C2864">工具描述里的使用边界</text>
      <text x="560" y="376" font-size="20" font-weight="bold" fill="#64748B">软</text>
      <text x="750" y="376" font-size="20" fill="#64748B">模型，不构成保证</text>
    </g>
    <g id="ctl-allow" data-pptx-bounds="70 396 1140 52">
      <rect x="70" y="396" width="1140" height="52" rx="8" fill="#F5F8FC"/>
      <text x="94" y="428" font-size="20" fill="#0C2864">工具的能力白名单</text>
      <text x="560" y="428" font-size="20" font-weight="bold" fill="#1B4593">硬</text>
      <text x="750" y="428" font-size="20" fill="#2064AE">工具注册表</text>
    </g>
    <g id="ctl-path" data-pptx-bounds="70 448 1140 52">
      <text x="94" y="480" font-size="20" fill="#0C2864">路径边界与参数校验</text>
      <text x="560" y="480" font-size="20" font-weight="bold" fill="#1B4593">硬</text>
      <text x="750" y="480" font-size="20" fill="#2064AE">工具实现</text>
    </g>
    <g id="ctl-output" data-pptx-bounds="70 500 1140 52">
      <rect x="70" y="500" width="1140" height="52" rx="8" fill="#F5F8FC"/>
      <text x="94" y="532" font-size="20" fill="#0C2864">输出路径限制</text>
      <text x="560" y="532" font-size="20" font-weight="bold" fill="#1B4593">硬</text>
      <text x="750" y="532" font-size="20" fill="#2064AE">产物登记服务</text>
    </g>
    <g id="ctl-sandbox" data-pptx-bounds="70 552 1140 52">
      <text x="94" y="584" font-size="20" fill="#0C2864">进程级隔离</text>
      <text x="560" y="584" font-size="20" font-weight="bold" fill="#1B4593">硬</text>
      <text x="750" y="584" font-size="20" fill="#2064AE">操作系统</text>
    </g>
  </g>

  <g id="fig-conclusion" data-pptx-bounds="70 624 1140 64">
    <rect x="70" y="624" width="1140" height="64" rx="8" fill="#EEF4FB"/>
    <path d="M78 624 a8 8 0 0 0 -8 8 v48 a8 8 0 0 0 8 8 z" fill="#1B4593"/>
    <text x="98" y="654" font-size="20" font-weight="bold" fill="#0C2864">「执行者」这一列不能空，空了就说明那条控制只是一句愿望</text>
    <text x="98" y="680" font-size="18" fill="#2064AE">在代码里检查了路径，不等于它跑在沙箱里：前者是一层检查，后者是一层强制。</text>
  </g>
</svg>
