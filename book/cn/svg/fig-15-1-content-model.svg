      <text x="460" y="296" font-size="18" fill="#D8E4F0">数字、主张、来源、层级都在这里，只在这里</text>
    </g>
    <line x1="640" y1="312" x2="430" y2="350" stroke="#7FA8D9" stroke-width="2"/>
    <line x1="640" y1="312" x2="850" y2="350" stroke="#7FA8D9" stroke-width="2"/>
    <g id="render-md" data-pptx-bounds="250 350 360 76">
