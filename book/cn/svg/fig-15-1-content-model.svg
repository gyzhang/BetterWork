  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="fig-header" data-pptx-bounds="70 126 1140 70">
    <text x="70" y="160" font-size="32" font-weight="bold" fill="#0C2864">事实只存一处，格式只是它的两条出口</text>
    <text x="70" y="192" font-size="20" fill="#64748B">数字写两遍就会变成两个数字。内容模型是那个唯一的源。</text>
  </g>

