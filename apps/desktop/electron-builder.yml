appId: dev.betterwork.desktop
productName: BetterWork
artifactName: '${productName}-${version}-${arch}.${ext}'

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: ../../resources/skills
    to: skills
    filter:
      - '**/*'
      - '!.DS_Store'
      - '!._*'
  - from: ../../resources/experts
    to: experts
    filter:
      - '**/*'
      - '!.DS_Store'
      - '!._*'
  - from: ../../resources/dependency-locks
    to: dependency-locks
    filter:
      - '*.json'
  - from: ../../resources/wheelhouse
    to: wheelhouse
    filter:
      - '*.whl'
      - 'manifest.json'
      - 'README.md'
  - from: build/python-runtime-assets
    to: python-runtime-assets
    filter:
      - '**/*'
      - '!.DS_Store'
      - '!._*'
  # ADR-0047：随包独立 Node.js 运行时（bin/node + npm/npx symlink + lib/node_modules/npm）。
  - from: build/node-runtime
    to: node-runtime
    filter:
      - '**/*'
      - '!.DS_Store'
      - '!._*'
  # 幻灯片预览的中文字体：系统自带中文字体是 TTC + AAT，opentype.js 解析不了，必须随包。
  - from: ../../resources/fonts
    to: fonts
    filter:
      - '*.otf'
      - '*.ttf'

# ADR-0047 决策 8：显式开启 runAsNode fuse。内置 MCP 已改用随包独立 Node，但 Knowledge worker
# 与 skill-guardian 仍以 Electron 内嵌 Node（ELECTRON_RUN_AS_NODE=1）运行；显式声明防止上游改变
# 出厂默认导致这些受管子进程静默失败。
electronFuses:
  runAsNode: true

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  background: build/background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

publish: []
