appId: dev.betterwork.desktop
productName: BetterWork

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: ../../resources/skills
    to: skills
    filter:
      - '**/*'
      - '!.DS_Store'
      - '!._*'
  - from: ../../resources/dependency-locks
    to: dependency-locks
    filter:
      - '*.json'
  # 幻灯片预览的中文字体：系统自带中文字体是 TTC + AAT，opentype.js 解析不了，必须随包。
  - from: ../../resources/fonts
    to: fonts
    filter:
      - '*.otf'
      - '*.ttf'

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish: []
