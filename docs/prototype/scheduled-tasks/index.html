<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>算台 · 定时任务低保真评审</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="bw-schedule-review">
      <style>
        #bw-schedule-review {
          --bw-surface: light-dark(#ffffff, #222222);
          --bw-canvas: light-dark(#fafafa, #1b1b1b);
          --bw-muted: light-dark(#f0f0f0, #303030);
          --bw-text: light-dark(#242424, #ededed);
          --bw-secondary: light-dark(#626262, #b8b8b8);
          --bw-border: light-dark(#d4d4d4, #505050);
          --bw-action: light-dark(#333333, #dddddd);
          --bw-action-text: light-dark(#ffffff, #222222);
          --bw-warning: light-dark(#805215, #e3bf84);
          --bw-warning-surface: light-dark(#fcf8ef, #302b24);
          --bw-danger: light-dark(#a13838, #efaaaa);
          --bw-overlay: light-dark(rgb(0 0 0 / 25%), rgb(0 0 0 / 55%));
          --bw-danger-surface: light-dark(#fcf4f4, #342727);
          --bw-font-caption: 12px;
          --bw-font-body: 13px;
          --bw-font-emphasis: 15px;
          --bw-font-heading: 18px;
          --bw-font-page: 20px;
          --bw-line-normal: 1.5;
          --bw-line-body: 1.6;
          --bw-control-sm: 28px;
          --bw-control-md: 32px;
          --bw-control-lg: 36px;
          --bw-radius: 6px;
          font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
          font-size: var(--bw-font-body);
          font-weight: 400;
          line-height: var(--bw-line-body);
          color: var(--bw-text);
          isolation: isolate;
        }
        #bw-schedule-review * {
          box-sizing: border-box;
        }
        #bw-schedule-review [hidden] {
          display: none !important;
        }
        #bw-schedule-review button,
        #bw-schedule-review input,
        #bw-schedule-review select,
        #bw-schedule-review textarea {
          font: inherit;
        }
        #bw-schedule-review button,
        #bw-schedule-review select,
        #bw-schedule-review input:not([type='checkbox']) {
          min-height: var(--bw-control-md);
          padding: 4px 12px;
          border: 1px solid var(--bw-border);
          border-radius: var(--bw-radius);
          background: var(--bw-surface);
          color: var(--bw-text);
          max-width: 100%;
        }
        #bw-schedule-review button {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }
        #bw-schedule-review button:hover {
          background: var(--bw-muted);
        }
        #bw-schedule-review button:disabled {
          opacity: 0.5;
        }
        #bw-schedule-review button.primary {
          background: var(--bw-action);
          color: var(--bw-action-text);
          border-color: var(--bw-action);
        }
        #bw-schedule-review button.link {
          border-color: transparent;
          background: transparent;
          padding-inline: 0;
          text-align: left;
          justify-content: flex-start;
        }
        #bw-schedule-review button.small {
          min-height: var(--bw-control-sm);
          padding: 4px 8px;
        }
        #bw-schedule-review .page-header button {
          min-height: var(--bw-control-lg);
        }
        #bw-schedule-review textarea {
          padding: 8px 12px;
          border: 1px solid var(--bw-border);
          border-radius: var(--bw-radius);
          background: var(--bw-surface);
          color: var(--bw-text);
          resize: vertical;
          min-width: 0;
        }
        #bw-schedule-review input[type='checkbox'] {
          accent-color: var(--bw-action);
        }
        #bw-schedule-review h1,
        #bw-schedule-review h2,
        #bw-schedule-review h3,
        #bw-schedule-review p {
          margin: 0;
        }
        #bw-schedule-review h1 {
          font-size: var(--bw-font-page);
          font-weight: 500;
        }
        #bw-schedule-review h2 {
          font-size: var(--bw-font-heading);
          font-weight: 500;
        }
        #bw-schedule-review h3,
        #bw-schedule-review .emphasis {
          font-size: var(--bw-font-emphasis);
          font-weight: 500;
        }
        #bw-schedule-review strong {
          font-weight: 500;
        }
        #bw-schedule-review small,
        #bw-schedule-review .caption {
          font-size: var(--bw-font-caption);
        }
        #bw-schedule-review .secondary {
          color: var(--bw-secondary);
        }
        #bw-schedule-review .stack {
          display: flex;
          flex-direction: column;
          gap: 16px;
          min-width: 0;
        }
        #bw-schedule-review .tight {
          gap: 8px;
        }
        #bw-schedule-review .row {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
          min-width: 0;
        }
        #bw-schedule-review .between {
          justify-content: space-between;
        }
        #bw-schedule-review .review-bar {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          align-items: center;
          padding: 12px 0;
          padding-right: 100px;
        }
        #bw-schedule-review .review-bar label {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }
        #bw-schedule-review .window {
          display: grid;
          grid-template-columns: 240px minmax(0, 1fr);
          min-height: 720px;
          border: 1px solid var(--bw-border);
          border-radius: 8px;
          background: var(--bw-surface);
        }
        #bw-schedule-review .sidebar {
          background: var(--bw-canvas);
          border-right: 1px solid var(--bw-border);
          padding: 16px;
          display: flex;
          flex-direction: column;
          gap: 24px;
          min-width: 0;
          border-radius: 8px 0 0 8px;
        }
        #bw-schedule-review .window-dots {
          display: flex;
          gap: 8px;
          padding-bottom: 8px;
        }
        #bw-schedule-review .window-dots span {
          height: 12px;
          width: 12px;
          border: 1px solid var(--bw-border);
          border-radius: 50%;
        }
        #bw-schedule-review .brand {
          font-size: var(--bw-font-heading);
          font-weight: 500;
        }
        #bw-schedule-review .navigation {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        #bw-schedule-review .navigation button {
          border-color: transparent;
          background: transparent;
          justify-content: flex-start;
        }
        #bw-schedule-review .navigation button[aria-current='page'] {
          background: var(--bw-muted);
          border-color: var(--bw-border);
        }
        #bw-schedule-review .space-tree {
          display: flex;
          flex-direction: column;
          gap: 8px;
          color: var(--bw-secondary);
        }
        #bw-schedule-review .space-tree button {
          justify-content: flex-start;
          text-align: left;
          border: 0;
          background: transparent;
        }
        #bw-schedule-review .bw-compact-label {
          display: none;
        }
        #bw-schedule-review .sidebar-footer {
          margin-top: auto;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        #bw-schedule-review .page-header {
          min-height: 70px;
          padding: 12px 28px;
          border-bottom: 1px solid var(--bw-border);
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
        }
        #bw-schedule-review .header-title {
          display: flex;
          flex-direction: column;
          gap: 4px;
          min-width: 0;
        }
        #bw-schedule-review .page-body {
          max-width: 860px;
          margin-inline: auto;
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 24px;
          overflow-wrap: anywhere;
        }
        #bw-schedule-review .surface {
          border: 1px solid var(--bw-border);
          border-radius: 8px;
          padding: 16px;
          background: var(--bw-surface);
        }
        #bw-schedule-review .schedule-row {
          border-bottom: 1px solid var(--bw-border);
          padding-block: 16px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        #bw-schedule-review .schedule-row:first-child {
          padding-top: 0;
        }
        #bw-schedule-review .schedule-row .identity {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
        }
        #bw-schedule-review .schedule-row .identity button {
          font-size: var(--bw-font-emphasis);
          font-weight: 500;
        }
        #bw-schedule-review .badge {
          display: inline-block;
          border: 1px solid var(--bw-border);
          border-radius: 4px;
          padding: 2px 8px;
          font-size: var(--bw-font-caption);
          white-space: nowrap;
        }
        #bw-schedule-review .badge.active {
          background: var(--bw-muted);
        }
        #bw-schedule-review .facts {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px 24px;
        }
        #bw-schedule-review .facts > div {
          min-width: 0;
        }
        #bw-schedule-review .field {
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-width: 0;
        }
        #bw-schedule-review .field label {
          font-weight: 500;
        }
        #bw-schedule-review .fields {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px 24px;
        }
        #bw-schedule-review .full {
          grid-column: 1 / -1;
        }
        #bw-schedule-review .section {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        #bw-schedule-review .section + .section {
          border-top: 1px solid var(--bw-border);
          padding-top: 24px;
        }
        #bw-schedule-review .chip {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 4px 8px;
          border: 1px solid var(--bw-border);
          border-radius: 4px;
        }
        #bw-schedule-review .chip button {
          border: 0;
          min-height: var(--bw-control-sm);
          padding: 0 4px;
        }
        #bw-schedule-review .notice {
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 12px 16px;
          border: 1px solid var(--bw-border);
          border-radius: 6px;
        }
        #bw-schedule-review .notice.warning {
          background: var(--bw-warning-surface);
          color: var(--bw-warning);
        }
        #bw-schedule-review .notice.danger {
          background: var(--bw-danger-surface);
          color: var(--bw-danger);
        }
        #bw-schedule-review .notice button {
          color: var(--bw-text);
        }
        #bw-schedule-review .preview-times {
          border-left: 2px solid var(--bw-border);
          padding-left: 16px;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        #bw-schedule-review .action-bar {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: flex-end;
          gap: 8px;
          border-top: 1px solid var(--bw-border);
          padding-top: 16px;
        }
        #bw-schedule-review .action-bar .explanation {
          margin-right: auto;
          flex-basis: 220px;
          flex-grow: 1;
        }
        #bw-schedule-review details {
          border-top: 1px solid var(--bw-border);
          padding-top: 12px;
        }
        #bw-schedule-review summary {
          padding-block: 4px;
        }
        #bw-schedule-review details > .stack {
          padding-top: 12px;
        }
        #bw-schedule-review table {
          width: 100%;
          border-collapse: collapse;
        }
        #bw-schedule-review th,
        #bw-schedule-review td {
          text-align: left;
          font-weight: 400;
          padding: 12px 8px;
          border-bottom: 1px solid var(--bw-border);
          vertical-align: top;
        }
        #bw-schedule-review th {
          color: var(--bw-secondary);
          font-size: var(--bw-font-caption);
        }
        #bw-schedule-review .empty {
          min-height: 280px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          text-align: center;
        }
        #bw-schedule-review .message {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        #bw-schedule-review .message.user {
          background: var(--bw-canvas);
          padding: 16px;
          border-radius: 8px;
        }
        #bw-schedule-review .composer {
          border: 1px solid var(--bw-border);
          border-radius: 8px;
          padding: 16px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        #bw-schedule-review dialog {
          width: min(560px, calc(100% - 32px));
          max-height: none;
          padding: 24px;
          border: 1px solid var(--bw-border);
          border-radius: 8px;
          background: var(--bw-surface);
          color: var(--bw-text);
        }
        #bw-schedule-review dialog::backdrop {
          background: var(--bw-overlay);
        }
        #bw-schedule-review dialog .modal-content {
          display: flex;
          flex-direction: column;
          gap: 24px;
        }
        #bw-schedule-review .choice {
          display: flex;
          align-items: flex-start;
          gap: 12px;
          padding: 12px 0;
          border-bottom: 1px solid var(--bw-border);
        }
        #bw-schedule-review .choice input {
          margin-top: 4px;
          flex: none;
        }
        #bw-schedule-review .choice > span {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        #bw-schedule-review .notification-list {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        @media (max-width: 1100px) {
          #bw-schedule-review .bw-full-label {
            display: none;
          }
          #bw-schedule-review .bw-compact-label {
            display: inline;
          }
          #bw-schedule-review .window {
            grid-template-columns: 88px minmax(0, 1fr);
          }
          #bw-schedule-review .sidebar {
            padding: 12px 8px;
          }
          #bw-schedule-review .navigation button {
            padding-inline: 4px;
            justify-content: center;
          }
          #bw-schedule-review .space-tree {
            display: none;
          }
          #bw-schedule-review .brand {
            text-align: center;
          }
          #bw-schedule-review .sidebar-footer button {
            padding-inline: 4px;
          }
        }
        @media (max-width: 700px) {
          #bw-schedule-review .fields,
          #bw-schedule-review .facts {
            grid-template-columns: minmax(0, 1fr);
          }
          #bw-schedule-review .page-header {
            padding: 16px;
          }
          #bw-schedule-review .page-body {
            padding: 16px;
          }
          #bw-schedule-review table,
          #bw-schedule-review tbody {
            display: block;
          }
          #bw-schedule-review thead {
            display: none;
          }
          #bw-schedule-review tr {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            padding-block: 12px;
            border-bottom: 1px solid var(--bw-border);
          }
          #bw-schedule-review td {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 0;
            padding: 4px;
          }
          #bw-schedule-review td::before {
            content: attr(data-label);
            font-size: var(--bw-font-caption);
            color: var(--bw-secondary);
          }
          #bw-schedule-review .review-bar {
            padding-right: 0;
          }
        }
        @media (max-width: 440px) {
          #bw-schedule-review .window {
            grid-template-columns: minmax(0, 1fr);
          }
          #bw-schedule-review .sidebar {
            border-right: 0;
            border-bottom: 1px solid var(--bw-border);
            border-radius: 8px 8px 0 0;
            gap: 12px;
          }
          #bw-schedule-review .window-dots,
          #bw-schedule-review .brand,
          #bw-schedule-review .sidebar-footer {
            display: none;
          }
          #bw-schedule-review .navigation {
            flex-direction: row;
            flex-wrap: wrap;
          }
          #bw-schedule-review .page-header {
            padding: 12px;
          }
          #bw-schedule-review .page-body {
            padding: 12px;
          }
          #bw-schedule-review .surface,
          #bw-schedule-review .composer {
            padding: 12px;
          }
          #bw-schedule-review dialog {
            padding: 16px;
          }
        }
      </style>
      <div class="review-bar" aria-label="原型评审导航">
        <span class="caption secondary">低保真 v0.1 · 待评审 · 模拟数据</span>
        <label
          >评审场景
          <select id="bw-review-scene">
            <option value="list">定时任务列表</option>
            <option value="create">新建定时任务</option>
            <option value="detail">规则详情与六期历史</option>
            <option value="missed">错过一期</option>
            <option value="task">本期缺材料</option>
            <option value="save-failed">成果保存失败</option>
            <option value="no-output">未生成约定产物</option>
            <option value="running">运行中与停止</option>
            <option value="startup-blocked">启动前阻塞</option>
            <option value="failed">执行失败或中断</option>
            <option value="overlap">本期重叠跳过</option>
            <option value="update">专家版本更新</option>
            <option value="blocked">启用校验失败</option>
            <option value="source-missing">知识来源缺失</option>
            <option value="conflict">编辑冲突与草稿</option>
            <option value="empty">首次空态</option>
            <option value="load-failed">列表读取失败</option>
            <option value="notifications">后台结果通知</option>
          </select>
        </label>
      </div>
      <div class="window">
        <aside class="sidebar" aria-label="应用导航">
          <div class="stack tight">
            <div class="window-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div class="brand">算台</div>
          </div>
          <nav class="navigation">
            <button type="button" data-action="work">工作</button>
            <button type="button" disabled>成果</button>
            <button type="button" disabled>知识</button>
            <button type="button" disabled>技能</button>
            <button type="button" disabled>专家</button>
            <button type="button" data-action="list" aria-current="page">定时任务</button>
          </nav>
          <div class="space-tree">
            <span class="caption">工作空间</span>
            <span>部门经营</span>
            <button type="button" data-action="task">8 月经营分析</button>
            <span>AI 研究</span>
            <span>我的工作空间</span>
          </div>
          <div class="sidebar-footer">
            <button type="button" data-action="notifications">
              <span class="bw-full-label">消息中心</span><span class="bw-compact-label">消息</span
              ><span>· 2</span>
            </button>
            <button type="button" disabled>设置</button>
          </div>
        </aside>
        <main id="bw-main" aria-label="定时任务原型"></main>
      </div>
      <dialog id="bw-dialog" aria-labelledby="bw-dialog-title">
        <div class="modal-content" id="bw-dialog-body"></div>
      </dialog>
      <script>
        (() => {
          const root = document.getElementById('bw-schedule-review');
          if (!root) return;
          const main = root.querySelector('#bw-main');
          const dialog = root.querySelector('#bw-dialog');
          const dialogBody = root.querySelector('#bw-dialog-body');
          const scene = root.querySelector('#bw-review-scene');
          if (!main || !dialog || !dialogBody || !scene) return;

            {

            filter: 'all',
            sourceKind: 'document',
            sourceDraft: [],

            conflict: false,
            sourceMissing: false,
            savedOutput: false,
            active: false,
            manualHistory: [],

                task: true,
                manual: true,
                result: '人工明确发起的新工作；未修改下次计划。',
              });
              state.occurrence = id;
              state.active = true;
              state.activeSchedule = state.selected;
              closeModal();
              state.page = 'detail';
            }
            if (action === 'open-active') {
              closeModal();
              state.page = 'task';
            }
            if (action === 'continue-task') {
              state.active = true;
              state.activeSchedule = state.selected;
            }
            if (action === 'stop-run') {
              state.active = false;
              const record = selectedRecord();
              if (record?.manual) {
                record.kind = 'cancelled';
                record.status = '已停止';
                record.result = '由你停止本次执行；定时规则保持原状态。';
              }
            }
            if (action === 'blocked-reason') {
              openModal(
                'blocked-reason',
                modalTitle('启动前检查未通过') +
                  '<p>经营分析专家 v4 所需模型未配置。</p><p>请到设置中的模型分区完成配置；定时任务保留记录，不会自动切换为其他模型。</p><div class="action-bar">' +
                  btn('关闭', 'close') +
                  '</div>',
              );
              return;
            }
            if (action === 'overlap-run') {
              state.extraRecords = [];
              state.occurrence = 'sep';
              state.page = 'task';
              state.active = true;
              state.activeSchedule = 'monthly';
            }
            if (action === 'materials') {
              materialsModal();
              return;
            }
            if (action === 'artifact') {
              openModal(
                'artifact',
                modalTitle('经营分析 PPT · 精确成果 v1') +
                  '<div class="surface stack tight"><strong>PPTX v1</strong><p>示例页面：经营概览、期间口径、主要变化、项目进展、待核对项。</p><p class="secondary">此处只展示成果身份与审阅入口，未生成真实 PPT。</p></div><p>本次版本保持不变；目录副本后续被人编辑时，将作为新输入。</p><div class="action-bar">' +
                  btn('关闭', 'close') +
                  '</div>',
              );
              return;
            }
            if (action === 'retry-save') state.savedOutput = true;
            if (action === 'toggle-enabled') {
              if (!(state.selected === 'ai' ? state.aiEnabled : state.enabled)) {
                openModal(
                  'enable',
                  modalTitle('启用定时任务') +
                    '<p>将按既定周期调用已配置的模型和工具，可能产生费用；错过不补跑，结果由你检查。</p><p class="secondary">从启用后的未来时刻开始，不补做暂停期间的工作。</p>' +
                    modalActions(btn('确认启用', 'confirm-enable', 'primary')),
                );
                return;
              }
              if (state.selected === 'ai') state.aiEnabled = false;
              else state.enabled = false;
            }
            if (action === 'confirm-enable') {
              if (state.selected === 'ai') state.aiEnabled = true;
              else state.enabled = true;
              closeModal();
            }
            if (action === 'archive') {
              openModal(
                'archive',
                modalTitle('归档这项定时任务？') +
                  '<p>停止未来触发，保留历史任务、成果、来源与工作目录文件。</p><p class="secondary">归档不会停止已经开始的运行；停止本次是独立动作。</p>' +
                  modalActions(btn('归档定时任务', 'confirm-archive')),
              );
              return;
            }
            if (action === 'confirm-archive') {
              state.archived = true;
              state.enabled = false;
              closeModal();
            }
            if (action === 'save-enabled' || action === 'save-paused') {
              if (!state.draft.name.trim() || !state.draft.prompt.trim() || !state.draft.time) {
                const error = root.querySelector('#bw-form-error');
                if (error)
                  error.innerHTML = notice(
                    '请补齐名称、工作要求与执行时刻',
                    '输入已保留。',
                    '',
                    true,
                  );
                return;
              }
              if (action === 'save-enabled' && (state.blocked || state.conflict)) return;
              if (state.page === 'create') {
                state.configId = `new-${state.nextConfigNumber}`;
                state.nextConfigNumber += 1;
              }
              state.configIsNew = state.page === 'create';
              state.config = structuredClone(state.draft);
              state.enabled =
                state.page === 'edit'
                  ? action === 'save-paused'
                    ? false
                    : state.enabled
                  : action === 'save-enabled';
              state.page = 'detail';
              state.selected = 'monthly';
            }
            if (action === 'cancel-edit') state.page = 'list';
            if (action === 'recheck') state.blocked = false;
            if (action === 'conflict-diff') {
              openModal(
                'conflict',
                modalTitle('最新配置与本地草稿') +
                  `<p>最新配置：名称为“月度经营例会”，工作要求追加来源页。</p><p>你的草稿：${escapeHtml(state.draft.name)}</p><p class="secondary">取消会保留本地输入；核对后重新应用改动，不直接覆盖最新版本。</p>${modalActions(btn('保留草稿，重新校验', 'resolve-conflict', 'primary'))}`,
              );
              return;
            }
            if (action === 'resolve-conflict') {
              state.conflict = false;
              closeModal();
            }
            if (action === 'notifications') {
              notificationModal();
              return;
            }
            if (action === 'notification-task') {
              closeModal();
              state.page = 'task';
              state.selected = 'monthly';
              state.occurrence = 'sep';
            }
            if (action === 'notification-missed') {
              closeModal();
              state.page = 'occurrence';
              state.selected = 'ai';
              state.occurrence = 'ai-sep';
            }
            render();
            persist();
          });
          dialog.addEventListener('close', () => {
            state.modal = '';
          });
          const restored = window.openai?.widgetState?.privateContent;
          if (restored && ['list', 'detail', 'task', 'occurrence'].includes(restored.page)) {
            state.page = restored.page;
            if (typeof restored.taskDraft === 'string') state.taskDraft = restored.taskDraft;
            if (history.some((item) => item.id === restored.occurrence))
              state.occurrence = restored.occurrence;
          }
          window.addEventListener('openai:set_globals', (event) => {
            const saved = event.detail?.globals?.widgetState?.privateContent;
            if (saved && typeof saved.taskDraft === 'string') state.taskDraft = saved.taskDraft;
          });
          render();
        })();
      </script>
    </div>
  </body>
</html>
