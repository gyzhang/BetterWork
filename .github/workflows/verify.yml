name: Verify

on:
  pull_request:
    branches:
      - main
  # 手动触发用于对当前代码重跑完整门禁并留存读数。
  workflow_dispatch:

# 同一 PR 只保留最新差异的验证结果；手动运行按当前分支归组。
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  classify:
    name: Classify changes
    runs-on: macos-latest
    outputs:
      has_code: ${{ steps.changes.outputs.has_code || steps.manual.outputs.has_code }}
      docs_only: ${{ steps.changes.outputs.docs_only || steps.manual.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 选择 PR 验证范围
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-pr-changes.mjs --pull-request "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: 手动运行完整门禁
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/classify-pr-changes.mjs --full >> "$GITHUB_OUTPUT"

  quality:
    name: Full verify
    needs: classify
    if: needs.classify.outputs.has_code == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          UI_RENDER_OUTPUT_DIR: ${{ github.workspace }}/.ui-render
      - name: 上传渲染检查产物
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-render-check
          path: |
            .ui-render/screenshots/
            .ui-render/results.json
            .ui-render/matrix-results.json
            .ui-render/results.partial.json
            .ui-render/app-journey.partial.json
            .ui-render/app-journey-*/
            .ui-render/process-recovery-*/
          retention-days: 14
      - name: 留存渲染检查读数
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ui-render-readings
          path: .ui-render/results.json
          retention-days: 7

  documentation:
    name: Documentation check
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.docs_only == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:check

  pr-gate:
    name: PR Gate
    needs:
      - classify
      - quality
      - documentation
    if: always() && github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: 确认对应范围的门禁通过
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HAS_CODE: ${{ needs.classify.outputs.has_code }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "差异分类失败：不能判断应运行哪一档门禁。"
            exit 1
          fi
          if [ "$HAS_CODE" = "true" ] && [ "$QUALITY_RESULT" != "success" ]; then
            echo "代码或混合差异必须通过 Full verify；结果：$QUALITY_RESULT"
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ] && [ "$DOCUMENTATION_RESULT" != "success" ]; then
            echo "纯 Markdown 差异必须通过 Documentation check；结果：$DOCUMENTATION_RESULT"
            exit 1
          fi
          echo "PR Gate passed."
