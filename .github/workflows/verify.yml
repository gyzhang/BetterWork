name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # 写了 permissions 键之后未点名的作用域就是 none；上传渲染检查产物需要 actions: write。
  actions: write

jobs:
  verify:
    name: Quality gate
    # 产品只支持 macOS（ADR-0036）：门禁必须跑在被支持的那个平台上。
    # ubuntu runner 测的是我们不需要兼容的平台，且 Electron 离屏渲染检查会在
    # Ubuntu 的 userns/AppArmor 限制下崩成 SIGTRAP——那是测错平台的噪声，不是代码缺陷。
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          # 渲染检查的截图与读数写进工作区，失败时整目录传成 artifact（见下一步）。
          UI_RENDER_OUTPUT_DIR: ${{ github.workspace }}/.ui-render
      # 断言只留一句标签时，换台机器红了就无从下手；产物随失败上传，图与读数都能回看。
      - name: 上传渲染检查产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-render-check
          path: |
            .ui-render/screenshots/
            .ui-render/results.json
            .ui-render/results.partial.json
          retention-days: 14
