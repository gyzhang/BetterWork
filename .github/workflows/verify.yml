name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  # 手动触发是这套门禁唯一的「同一份代码再跑一次拿读数」入口：审计时要回答
  # 「绿跑长什么样」「这轮比上轮慢了多少」，只有 push 事件的话，不改动代码就制造不出一条运行。
  workflow_dispatch:

# 连续推送时只保留最新一次的读数：macOS runner 按分钟计费，跑完一条已经不代表 HEAD 的运行
# 既烧钱又会把「当前 main 是否绿」读成旧事实。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 写了 permissions 键之后未点名的作用域就是 none；上传渲染检查产物需要 actions: write。
  actions: write

jobs:
  verify:
    name: Quality gate
    # 产品只支持 macOS（ADR-0036）：门禁必须跑在被支持的那个平台上。
    # ubuntu runner 测的是我们不需要兼容的平台，且 Electron 离屏渲染检查会在
    # Ubuntu 的 userns/AppArmor 限制下崩成 SIGTRAP——那是测错平台的噪声，不是代码缺陷。
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          # 渲染检查的截图与读数写进工作区，失败时整目录传成 artifact（见下一步）。
          UI_RENDER_OUTPUT_DIR: ${{ github.workspace }}/.ui-render
      # 断言只留一句标签时，换台机器红了就无从下手；产物随失败上传，图与读数都能回看。
      - name: 上传渲染检查产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-render-check
          path: |
            .ui-render/screenshots/
            .ui-render/results.json
            .ui-render/results.partial.json
          retention-days: 14
      # 绿跑也要留读数：「这条判据这轮是不是变严了」「每组渲染耗时漂了多少」只能拿两次读数对比回答，
      # 而只随失败上传的产物在连着两次绿跑之间是空的。只传 results.json——绿跑的截图没有诊断价值，
      # 16 组 × 两档窗口的图白占空间，保留期也因此压到 7 天。
      - name: 留存渲染检查读数
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui-render-readings
          path: .ui-render/results.json
          retention-days: 7
