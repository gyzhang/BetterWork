name: Verify

on:
  pull_request:
    branches:
      - main
  # 手动触发对所选分支运行完整验证；夜间计划检查 main 最新提交。
  workflow_dispatch:
  schedule:
    # UTC 15:30 = Asia/Shanghai 23:30，避开整点的调度高峰。
    - cron: '30 15 * * *'

# 同一 PR 只保留最新差异；手动与夜间完整验证分别归组。
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  classify:
    name: Classify changes
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    outputs:
      has_code: ${{ steps.changes.outputs.has_code }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 选择 PR 验证范围
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA...$HEAD_SHA"
          node scripts/classify-pr-changes.mjs --pull-request "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  quick:
    name: Quick code check
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.has_code == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run docs:check
      # Vitest 按 PR 基点和依赖图选择相关测试；两档依次运行，保留重档的串行约束。
      - name: 检查受影响的功能测试
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npx vitest run --project functional --changed="$BASE_SHA" --passWithNoTests
      - name: 检查受影响的重档测试
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npx vitest run --project heavy --changed="$BASE_SHA" --passWithNoTests

  quality:
    name: Full verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # verify 包含 drift-check 的 CLI 回归，必须取到 origin/main 与完整历史。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          UI_RENDER_OUTPUT_DIR: ${{ github.workspace }}/.ui-render
      - name: 上传渲染检查产物
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-render-check
          path: |
            .ui-render/screenshots/
            .ui-render/results.json
            .ui-render/matrix-results.json
            .ui-render/results.partial.json
            .ui-render/app-journey.partial.json
            .ui-render/app-journey-*/
            .ui-render/process-recovery-*/
          retention-days: 14
          include-hidden-files: true
      - name: 留存渲染检查读数
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ui-render-readings
          path: .ui-render/results.json
          retention-days: 7
          include-hidden-files: true

  documentation:
    name: Documentation check
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.docs_only == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:check

  pr-gate:
    name: PR Gate
    needs:
      - classify
      - quick
      - documentation
    if: always() && github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: 确认对应范围的门禁通过
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HAS_CODE: ${{ needs.classify.outputs.has_code }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          QUICK_RESULT: ${{ needs.quick.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "差异分类失败：不能判断应运行哪一档门禁。"
            exit 1
          fi
          if [ "$HAS_CODE" = "true" ] && [ "$DOCS_ONLY" = "false" ]; then
            if [ "$QUICK_RESULT" != "success" ]; then
              echo "代码或混合差异必须通过 Quick code check；结果：$QUICK_RESULT"
              exit 1
            fi
          elif [ "$HAS_CODE" = "false" ] && [ "$DOCS_ONLY" = "true" ]; then
            if [ "$DOCUMENTATION_RESULT" != "success" ]; then
              echo "纯 Markdown 差异必须通过 Documentation check；结果：$DOCUMENTATION_RESULT"
              exit 1
            fi
          else
            echo "差异分类输出无效：不能选择对应的 PR 门禁。"
            exit 1
          fi
          echo "PR Gate passed."
