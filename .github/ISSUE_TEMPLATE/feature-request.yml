name: 功能需求
description: 提出一个新功能或改进建议
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请填写以下信息，帮助我们理解你的需求。

  - type: textarea
    id: problem
    attributes:
      label: 你的需求是否与某个问题相关？
      description: 清晰简洁地描述这个问题
      placeholder: 我经常遇到...的问题，因为...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望看到的功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 有没有其他方法可以解决这个问题？

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能对你来说有多重要？
      options:
        - 低 - 有了更好
        - 中 - 会经常用到
        - 高 - 没有会影响工作流
        - 关键 - 阻塞了我的使用
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关领域
      description: 这个功能主要涉及哪个方面？
      options:
        - 聊天与对话
        - 知识库与记忆
        - 技能与专家
        - 成果与 Artifact
        - 界面与交互
        - 性能与稳定性
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 使用场景
      description: 描述你会在什么场景下使用这个功能
      placeholder: 当我需要...时，我会...

  - type: textarea
    id: additional
    attributes:
      label: 额外信息
      description: 还有其他要补充的吗？比如参考设计、竞品做法等
