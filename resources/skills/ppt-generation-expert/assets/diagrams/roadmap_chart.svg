<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- diagram/roadmap_chart — 路线图（拓扑原子：order 阶段轴 × membership 泳道，正交叠加）
       用途：多条工作流在同一时间轴上并行推进的规划视图（能力线 / 业务线 / 治理线）。
       边界：只有单一序列 → diagram/timeline_chart；任务级起止与工时 → chart/gantt_chart。
       结构规则：列=阶段、行=泳道，形成矩阵；同一泳道跨阶段用同一色系，不同泳道色相必须区分；
                 已落地=实线边框+左侧色条，计划中=虚线边框+灰字，二者不得只靠文字区分；
                 每格最多一个条目，格子承载不下就拆页而不是缩字号。
       改法：泳道高 110px、行距 120px（y 254 / 374 / 494）；阶段列宽 235px、列距 245px（x 230 / 475 / 720 / 965）；
             条目块 = 列 x+18，泳道 y+19，尺寸 199×72px；阶段表头高 44px（y 200）。
       分组：表头一行 + 三条泳道各成一组，组边界沿 y 首尾相接（重叠 0px），
             竖网格线按组切段分配，避免组边界跨越线宽。 -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="summary-band" data-pptx-bounds="70 135 1140 50">
    <rect x="70" y="135" width="1140" height="50" rx="8" fill="#E4E6EA"/>
    <path d="M76 135.25A8 8 0 0 0 70 143V177A8 8 0 0 0 76 184.75Z" fill="#1B4593"/>
    <text x="92" y="159" font-size="14" fill="#0C2864">三线并行推进：平台能力领先业务落地一个季度，治理合规始终与业务同步交付。</text>
    <text x="92" y="177" font-size="14" fill="#0C2864">当前 Q3：平台线进入多智能体协同，业务线 3 个场景已闭环，治理线补齐模型评测。</text>
  </g>

