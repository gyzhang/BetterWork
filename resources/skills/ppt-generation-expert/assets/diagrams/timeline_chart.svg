<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- diagram/timeline_chart — 事件时间轴（拓扑原子：order 单一路径 + node 里程碑点）
       用途：按时间顺序排列的关键事件、政策节点、版本发布，强调「先后」而非「时长」。
       边界：任务时长 → diagram/project_schedule_table 或 chart/gantt_chart；阶段划分 → diagram/milestone_chart。
       结构规则：一条水平主轴；事件点上下交替（避免标签互撞）；每个事件仅一个时间点；
                 已完成段用实线+实心点，计划段用虚线+空心点，二者不得混用同一视觉。
       改法：事件点 x 均匀分布，间距 180px；卡片宽 180px、高 76px（以事件点为中心左右各 90px）；
             上排卡片 y=300、下排 y=470；主轴 y=420，点半径 9px，刻度线连接卡片与主轴。
       分组：卡片带 / 主轴带 / 图例 / 脚注各自成组；三带沿 y 轴首尾相接（重叠 0px，满足 ≤1px 容差）。 -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="summary-band" data-pptx-bounds="70 135 1140 50">
    <rect x="70" y="135" width="1140" height="50" rx="8" fill="#E4E6EA"/>
    <path d="M76 135.25A8 8 0 0 0 70 143V177A8 8 0 0 0 76 184.75Z" fill="#1B4593"/>
    <text x="92" y="159" font-size="14" fill="#0C2864">12 个月内完成 6 个关键节点：4 个已落地、2 个在推进，触发点集中在 Q1 与 Q3。</text>
    <text x="92" y="177" font-size="14" fill="#0C2864">两个节点均由外部政策变更触发，属被动响应，后续节奏需预留缓冲。</text>
  </g>

  <g id="tl-events-top" data-pptx-bounds="90 292 1090 84">
    <g id="tl-event-01">
      <rect x="90" y="300" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
      <text x="106" y="324" font-size="16" font-weight="bold" fill="#0C2864">2026-01</text>
      <text x="106" y="346" font-size="14" fill="#0C2864">立项批复</text>
      <text x="106" y="366" font-size="13" fill="#778495">预算 682 万获批</text>
    </g>
    <g id="tl-event-03">
      <rect x="450" y="300" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
      <text x="466" y="324" font-size="16" font-weight="bold" fill="#0C2864">2026-05</text>
      <text x="466" y="346" font-size="14" fill="#0C2864">一期上线</text>
      <text x="466" y="366" font-size="13" fill="#778495">覆盖 3 个场景</text>
    </g>
    <g id="tl-event-05">
      <rect x="810" y="300" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#778495" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="826" y="324" font-size="16" font-weight="bold" fill="#778495">2026-09 计划</text>
      <text x="826" y="346" font-size="14" fill="#778495">二期场景扩面</text>
      <text x="826" y="366" font-size="13" fill="#778495">目标再增 5 个场景</text>
    </g>
  </g>

  <g id="tl-axis" data-pptx-bounds="100 376 1090 94">
    <line x1="110" y1="420" x2="720" y2="420" stroke="#1B4593" stroke-width="3"/>
    <line x1="720" y1="420" x2="1170" y2="420" stroke="#778495" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="180" y1="376" x2="180" y2="411" stroke="#778495" stroke-width="1.5"/>
    <line x1="360" y1="429" x2="360" y2="470" stroke="#778495" stroke-width="1.5"/>
    <line x1="540" y1="376" x2="540" y2="411" stroke="#778495" stroke-width="1.5"/>
    <line x1="720" y1="429" x2="720" y2="470" stroke="#778495" stroke-width="1.5"/>
    <line x1="900" y1="376" x2="900" y2="411" stroke="#778495" stroke-width="1.5"/>
    <line x1="1080" y1="429" x2="1080" y2="470" stroke="#778495" stroke-width="1.5"/>
    <circle cx="180" cy="420" r="9" fill="#1B4593"/>
    <circle cx="360" cy="420" r="9" fill="#1B4593"/>
    <circle cx="540" cy="420" r="9" fill="#1B4593"/>
    <circle cx="720" cy="420" r="9" fill="#1B4593"/>
    <circle cx="900" cy="420" r="9" fill="#FFFFFF" stroke="#778495" stroke-width="2"/>
    <circle cx="1080" cy="420" r="9" fill="#FFFFFF" stroke="#778495" stroke-width="2"/>
    <text x="720" y="396" font-size="13" fill="#1B4593" text-anchor="middle">当前</text>
  </g>

  <g id="tl-events-bottom" data-pptx-bounds="90 470 1090 82">
    <g id="tl-event-02">
      <rect x="270" y="470" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
      <text x="286" y="494" font-size="16" font-weight="bold" fill="#0C2864">2026-03</text>
      <text x="286" y="516" font-size="14" fill="#0C2864">架构评审通过</text>
      <text x="286" y="536" font-size="13" fill="#778495">新增报工 59 万</text>
    </g>
    <g id="tl-event-04">
      <rect x="630" y="470" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
      <text x="646" y="494" font-size="16" font-weight="bold" fill="#0C2864">2026-07</text>
      <text x="646" y="516" font-size="14" fill="#0C2864">首次确认收入</text>
      <text x="646" y="536" font-size="13" fill="#778495">转入投产期</text>
    </g>
    <g id="tl-event-06">
      <rect x="990" y="470" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#778495" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="1006" y="494" font-size="16" font-weight="bold" fill="#778495">2026-11 计划</text>
      <text x="1006" y="516" font-size="14" fill="#778495">全行推广</text>
      <text x="1006" y="536" font-size="13" fill="#778495">覆盖 12 家分行</text>
    </g>
  </g>

  <g id="tl-legend" data-pptx-bounds="70 600 900 40">
    <circle cx="90" cy="618" r="9" fill="#1B4593"/>
    <text x="108" y="623" font-size="14" fill="#778495">已落地（实线主轴 + 实心点）</text>
    <circle cx="380" cy="618" r="9" fill="#FFFFFF" stroke="#778495" stroke-width="2"/>
    <text x="398" y="623" font-size="14" fill="#778495">计划中（虚线主轴 + 空心点）</text>
  </g>

  <g id="tl-footnote" data-pptx-bounds="70 660 900 26">
    <text x="70" y="672" font-size="14" fill="#778495">事件点上下交替排布以避免标签碰撞；每个事件只承载一个时间点，区间用 milestone_chart 表达。</text>
  </g>
</svg>
