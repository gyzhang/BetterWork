<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- diagram/network_graph — 关系网络图（拓扑原子：link 的 hub 星型）
       用途：一个主体与多个外部系统/团队的调用、依赖、往来强度。
       边界：层级归属 → diagram/org_chart；有方向的先后 → diagram/flow_chart。
       结构规则：一个 hub + 若干叶节点；边从 hub 辐射，不做叶间连线（除非叶间确有直连且需要表达）；
                 边宽编码强度（不要用箭头方向代替强度）；叶节点等半径圆，不编码大小。
       改法：hub 半径 72px、叶节点 52px；叶节点按 hub 为中心均匀分布，圆心距 210~230px；
             边宽 = 1 + 2×(强度/最大强度)，本图最大强度 42 → 3.0px；
             侧栏强度条长度 = 190 × 强度 / 42 px。
       分组：每个模块一个顶层 g id 并声明 data-pptx-bounds（根坐标、完整包住组内元素）。 -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="summary-band" data-pptx-bounds="70 135 1140 50">
    <rect x="70" y="135" width="1140" height="50" rx="8" fill="#E4E6EA"/>
    <path d="M76 135.25A8 8 0 0 0 70 143V177A8 8 0 0 0 76 184.75Z" fill="#1B4593"/>
    <text x="92" y="159" font-size="14" fill="#0C2864">本项目共对接 5 个系统，接口调用总量 126 万次/月，前两个系统占 63%。</text>
    <text x="92" y="177" font-size="14" fill="#0C2864">移动端仅 8 万次且无写入，属低频只读依赖，可延后解耦。</text>
  </g>

  <g id="net-graph" data-pptx-bounds="170 190 780 470">
    <line x1="560" y1="420" x2="250" y2="250" stroke="#1B4593" stroke-width="3"/>
    <line x1="560" y1="420" x2="560" y2="250" stroke="#1B4593" stroke-width="3"/>
    <line x1="560" y1="420" x2="870" y2="250" stroke="#266DE7" stroke-width="2"/>
    <line x1="560" y1="420" x2="310" y2="600" stroke="#778495" stroke-width="1.5"/>
    <line x1="560" y1="420" x2="830" y2="600" stroke="#266DE7" stroke-width="2"/>
    <text x="392" y="328" font-size="14" fill="#0C2864" text-anchor="end">42</text>
    <text x="574" y="332" font-size="14" fill="#0C2864">38</text>
    <text x="728" y="328" font-size="14" fill="#0C2864">21</text>
    <text x="420" y="516" font-size="14" fill="#778495" text-anchor="end">8</text>
    <text x="708" y="516" font-size="14" fill="#0C2864">17</text>
    <g id="net-hub">
      <circle cx="560" cy="420" r="72" fill="#0C2864"/>
      <text x="560" y="415" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">本项目</text>
      <text x="560" y="437" font-size="13" fill="#E4E6EA" text-anchor="middle">对接 5 个系统</text>
    </g>
    <g id="net-nodes">
      <circle cx="250" cy="250" r="52" fill="#1B4593"/>
      <text x="250" y="245" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">数据中台</text>
      <text x="250" y="265" font-size="13" fill="#E4E6EA" text-anchor="middle">读+写</text>
      <circle cx="560" cy="250" r="52" fill="#1B4593"/>
      <text x="560" y="245" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">智能体平台</text>
      <text x="560" y="265" font-size="13" fill="#E4E6EA" text-anchor="middle">读+写</text>
      <circle cx="870" cy="250" r="52" fill="#FFFFFF" stroke="#266DE7" stroke-width="1.5"/>
      <text x="870" y="245" font-size="14" font-weight="bold" fill="#0C2864" text-anchor="middle">信贷核心</text>
      <text x="870" y="265" font-size="13" fill="#778495" text-anchor="middle">只读</text>
      <circle cx="310" cy="600" r="52" fill="#E4E6EA"/>
      <text x="310" y="595" font-size="14" font-weight="bold" fill="#0C2864" text-anchor="middle">移动端</text>
      <text x="310" y="615" font-size="13" fill="#778495" text-anchor="middle">只读</text>
      <circle cx="830" cy="600" r="52" fill="#FFFFFF" stroke="#266DE7" stroke-width="1.5"/>
      <text x="830" y="595" font-size="14" font-weight="bold" fill="#0C2864" text-anchor="middle">风控引擎</text>
      <text x="830" y="615" font-size="13" fill="#778495" text-anchor="middle">只写</text>
    </g>
  </g>

  <g id="net-strength" data-pptx-bounds="980 250 230 400">
    <rect x="980" y="250" width="230" height="400" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
    <text x="1000" y="280" font-size="16" font-weight="bold" fill="#0C2864">关联强度排行</text>
    <text x="1190" y="280" font-size="13" fill="#778495" text-anchor="end">次/月</text>
    <line x1="1000" y1="300" x2="1190" y2="300" stroke="#E4E6EA" stroke-width="1"/>
    <text x="1000" y="320" font-size="14" fill="#0C2864">数据中台</text>
    <text x="1190" y="320" font-size="14" font-weight="bold" fill="#1B4593" text-anchor="end">42 万</text>
    <rect x="1000" y="330" width="190" height="6" fill="#0C2864"/>
    <line x1="1000" y1="356" x2="1190" y2="356" stroke="#E4E6EA" stroke-width="1"/>
    <text x="1000" y="376" font-size="14" fill="#0C2864">智能体平台</text>
    <text x="1190" y="376" font-size="14" font-weight="bold" fill="#1B4593" text-anchor="end">38 万</text>
    <rect x="1000" y="386" width="172" height="6" fill="#1B4593"/>
    <line x1="1000" y1="412" x2="1190" y2="412" stroke="#E4E6EA" stroke-width="1"/>
    <text x="1000" y="432" font-size="14" fill="#0C2864">信贷核心</text>
    <text x="1190" y="432" font-size="14" font-weight="bold" fill="#1B4593" text-anchor="end">21 万</text>
    <rect x="1000" y="442" width="95" height="6" fill="#266DE7"/>
    <line x1="1000" y1="468" x2="1190" y2="468" stroke="#E4E6EA" stroke-width="1"/>
    <text x="1000" y="488" font-size="14" fill="#0C2864">风控引擎</text>
    <text x="1190" y="488" font-size="14" font-weight="bold" fill="#1B4593" text-anchor="end">17 万</text>
    <rect x="1000" y="498" width="77" height="6" fill="#266DE7"/>
    <line x1="1000" y1="524" x2="1190" y2="524" stroke="#E4E6EA" stroke-width="1"/>
    <text x="1000" y="544" font-size="14" fill="#0C2864">移动端</text>
    <text x="1190" y="544" font-size="14" font-weight="bold" fill="#1B4593" text-anchor="end">8 万</text>
    <rect x="1000" y="554" width="36" height="6" fill="#778495"/>
    <text x="1000" y="596" font-size="13" fill="#778495">接口调用总量 126 万次/月</text>
    <text x="1000" y="618" font-size="13" fill="#778495">写入类接口仅 3 个</text>
  </g>

  <g id="net-legend" data-pptx-bounds="70 660 900 26">
    <line x1="70" y1="672" x2="110" y2="672" stroke="#1B4593" stroke-width="3"/>
    <text x="120" y="677" font-size="14" fill="#778495">强关联</text>
    <line x1="200" y1="672" x2="240" y2="672" stroke="#266DE7" stroke-width="2"/>
    <text x="250" y="677" font-size="14" fill="#778495">中</text>
    <line x1="300" y1="672" x2="340" y2="672" stroke="#778495" stroke-width="1.5"/>
    <text x="350" y="677" font-size="14" fill="#778495">弱。线宽编码强度，不用箭头方向代替强度；叶节点等半径，不编码调用量大小。</text>
  </g>
</svg>
