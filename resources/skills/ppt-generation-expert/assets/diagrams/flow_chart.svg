<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <!-- diagram/flow_chart — 流程图（拓扑原子：order 阅读路径 + link 分支）
       用途：审批/受理/实施等有方向、有分支、有回退的作业流程。
       边界：只表达顺序与分支，不表达时长 → 时长条用 diagram/project_schedule_table 或 chart/gantt_chart。
       结构规则：主路径单方向推进；折返用一个 switch-back（本图第 2 行向左）；
                 分支只从判定节点出，且必须标注条件（通过/不通过）；
                 箭头一律「轴线 + 实心三角头」，轴线长 ≥34px 保证可读。
       改法：节点等高 56px；行距 215px（y 245 / 460）；同排节点水平净距 ≥50px；
             箭头三角头尺寸 14×20px，顶点落在目标节点边缘。
       分组：每个模块一个顶层 g id 并声明 data-pptx-bounds（根坐标、完整包住组内元素）。 -->
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>

  <g id="summary-band" data-pptx-bounds="70 135 1140 50">
    <rect x="70" y="135" width="1140" height="50" rx="8" fill="#E4E6EA"/>
    <path d="M76 135.25A8 8 0 0 0 70 143V177A8 8 0 0 0 76 184.75Z" fill="#1B4593"/>
    <text x="92" y="159" font-size="14" fill="#0C2864">全流程 4 个主环节、1 个判定节点，平均时效 12 个工作日，一次通过率 78%。</text>
    <text x="92" y="177" font-size="14" fill="#0C2864">退回原因集中在方案评审环节，占全部退回量的 63%，已加前置完整性校验。</text>
  </g>

  <g id="flow-main" data-pptx-bounds="70 195 1140 355">
    <line x1="300" y1="273" x2="336" y2="273" stroke="#1B4593" stroke-width="1.5"/>
    <polygon points="336,263 350,273 336,283" fill="#1B4593"/>
    <line x1="560" y1="273" x2="616" y2="273" stroke="#1B4593" stroke-width="1.5"/>
    <polygon points="616,263 630,273 616,283" fill="#1B4593"/>
    <line x1="770" y1="273" x2="926" y2="273" stroke="#DF203C" stroke-width="1.5"/>
    <polygon points="926,263 940,273 926,283" fill="#DF203C"/>
    <polyline points="700,343 700,488 574,488" fill="none" stroke="#1B4593" stroke-width="1.5"/>
    <polygon points="574,478 560,488 574,498" fill="#1B4593"/>
    <line x1="350" y1="488" x2="314" y2="488" stroke="#1B4593" stroke-width="1.5"/>
    <polygon points="314,478 300,488 314,498" fill="#1B4593"/>
    <g id="flow-step-intake">
      <rect x="90" y="245" width="210" height="56" rx="8" fill="#0C2864"/>
      <text x="195" y="270" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. 需求受理</text>
      <text x="195" y="290" font-size="13" fill="#E4E6EA" text-anchor="middle">业务部门提交</text>
      <text x="195" y="325" font-size="13" fill="#778495" text-anchor="middle">T+0</text>
    </g>
    <g id="flow-step-review">
      <rect x="350" y="245" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
      <text x="455" y="270" font-size="16" font-weight="bold" fill="#0C2864" text-anchor="middle">2. 方案评审</text>
      <text x="455" y="290" font-size="13" fill="#778495" text-anchor="middle">技术+业务双签</text>
      <text x="455" y="325" font-size="13" fill="#778495" text-anchor="middle">T+3</text>
    </g>
    <g id="flow-decision">
      <polygon points="700,203 770,273 700,343 630,273" fill="#E4E6EA" stroke="#266DE7" stroke-width="1.5"/>
      <text x="700" y="278" font-size="14" font-weight="bold" fill="#0C2864" text-anchor="middle">评审通过？</text>
      <text x="712" y="400" font-size="14" fill="#1B4593">通过</text>
      <text x="850" y="246" font-size="14" fill="#DF203C">不通过</text>
    </g>
    <g id="flow-exception">
      <rect x="940" y="245" width="270" height="56" rx="8" fill="#FFFFFF" stroke="#DF203C" stroke-width="1.5"/>
      <text x="1075" y="270" font-size="16" font-weight="bold" fill="#DF203C" text-anchor="middle">退回补充材料</text>
      <text x="1075" y="290" font-size="13" fill="#778495" text-anchor="middle">一次通过率 78%</text>
    </g>
    <g id="flow-step-build">
      <rect x="350" y="460" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
      <text x="455" y="485" font-size="16" font-weight="bold" fill="#0C2864" text-anchor="middle">3. 开发实施</text>
      <text x="455" y="505" font-size="13" fill="#778495" text-anchor="middle">双周迭代交付</text>
      <text x="455" y="540" font-size="13" fill="#778495" text-anchor="middle">T+5 至 T+12</text>
    </g>
    <g id="flow-step-release">
      <rect x="90" y="460" width="210" height="56" rx="8" fill="#1B4593"/>
      <text x="195" y="485" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. 上线归档</text>
      <text x="195" y="505" font-size="13" fill="#E4E6EA" text-anchor="middle">验收 + 资产入库</text>
      <text x="195" y="540" font-size="13" fill="#778495" text-anchor="middle">T+12</text>
    </g>
  </g>

  <g id="flow-kpi" data-pptx-bounds="90 578 1120 68">
    <rect x="90" y="580" width="360" height="64" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
    <text x="110" y="612" font-size="22" font-weight="bold" fill="#1B4593">12 个工作日</text>
    <text x="110" y="633" font-size="14" fill="#778495">平均端到端时效</text>
    <rect x="470" y="580" width="360" height="64" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
    <text x="490" y="612" font-size="22" font-weight="bold" fill="#1B4593">78%</text>
    <text x="490" y="633" font-size="14" fill="#778495">方案评审一次通过率</text>
    <rect x="850" y="580" width="360" height="64" rx="8" fill="#FFFFFF" stroke="#1B4593" stroke-width="1.5"/>
    <text x="870" y="612" font-size="22" font-weight="bold" fill="#1B4593">63%</text>
    <text x="870" y="633" font-size="14" fill="#778495">退回集中在评审环节</text>
  </g>

  <g id="flow-legend" data-pptx-bounds="70 660 900 28">
    <text x="70" y="672" font-size="14" fill="#778495">实心三角为流向箭头；红色仅用于异常分支（退回），单页占比 5% 以内。</text>
  </g>
</svg>
